# JRL-MC ThetaS equirectangular RGBD model

#==============#
# Camera Model #
#==============#

Camera:
  name: "JRL standard equirectangular RGBD"
  setup: "monocular"
  model: "equirectangular"

  fps: 9.0
  cols: 1440
  rows: 720
  # depth_threshold: 40.0
  # true_baseline: 0.0

  color_order: "RGB"

#=====================#
# Tracking Parameters #
#=====================#

Preprocessing:
  min_size: 800
  # depthmap_factor: 5000.0 # Note: Set it to 1.0 for the rosbag format data set.

Tracking:
  # backend: "g2o"
  enable_auto_relocalization: true

    
#================#
# ORB Parameters #
#================#

Feature:
  name: "default ORB feature extraction setting"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7
  max_num_keypoints: 2000

#====================#
# Mapping Parameters #
#====================#

Mapping:
#  baseline_dist_thr: 0.07471049682
  redundant_obs_ratio_thr: 0.9
  # backend: "g2o"
  baseline_dist_thr_ratio: 0.02
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20

LoopDetector:
  # backend: "g2o"
  enabled: true
  # reject_by_graph_distance: true
  min_distance_on_graph: 50

System:
  map_format: "msgpack"

#============================#
# SocketPublisher Parameters #
#============================#
    
# append this entry
SocketPublisher:

